<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBank — Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <!-- Top bar -->
    <div class="topbar">
        <div class="topbar-left">
            <div class="avatar" id="userAvatar">?</div>
            <div>
                <div class="brand-name">My<span>Bank</span></div>
                <div style="font-size:12px;color:var(--gray);" id="welcomeName"></div>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <!-- Total balance -->
    <div class="card">
        <div class="summary-label">Total Balance</div>
        <div style="font-size:28px;font-weight:700;margin-top:6px;">₹<span id="totalBalance">0</span></div>
    </div>

    <!-- Accounts -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Your Accounts</h3>
        <div id="accounts"><p style="color:#888;">Loading accounts…</p></div>
    </div>

    <!-- Transfer -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Transfer Money</h3>
        <label>From Account</label>
        <input type="text" id="from" placeholder="Auto-filled from selection" readonly/>
        <label>To Account</label>
        <input type="text" id="to" placeholder="Recipient account number"/>
        <label>Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/>
        <button onclick="transfer()">Send Money →</button>
    </div>

    <!-- Summary -->
    <div class="card">
        <div class="summary-grid">
            <div class="summary-box">
                <div class="summary-label">Total Sent</div>
                <div class="summary-value sent" id="totalSent">₹0</div>
                <div class="summary-sub"><span id="sentCount">0</span> transactions</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Total Received</div>
                <div class="summary-value received" id="totalReceived">₹0</div>
                <div class="summary-sub"><span id="receivedCount">0</span> transactions</div>
            </div>
            <div class="summary-box">
                <div class="summary-label">Total Transactions</div>
                <div class="summary-value" id="totalTransactions">0</div>
            </div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" id="tabAll" onclick="setTab('all')">All</button>
            <button class="tab-btn" id="tabSent" onclick="setTab('sent')">Sent</button>
            <button class="tab-btn" id="tabReceived" onclick="setTab('received')">Received</button>
        </div>
    </div>

    <!-- Transaction history -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Transaction History</h3>
        <table class="txn-table">
            <thead>
            <tr>
                <th>Transaction</th>
                <th>Accounts</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="txnBody">
            <tr><td colspan="3" style="text-align:center;color:#888;">Loading transactions…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script src="/dashboard.js"></script>
<script>
    function setTab(which) {
        document.getElementById('tabAll').classList.toggle('active', which === 'all');
        document.getElementById('tabSent').classList.toggle('active', which === 'sent');
        document.getElementById('tabReceived').classList.toggle('active', which === 'received');

        if (which === 'all') showAll();
        if (which === 'sent') showSent();
        if (which === 'received') showReceived();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('userId');
        localStorage.removeItem('email');
        localStorage.removeItem('name');
        window.location.href = '/index.html';
    }

    // Show initial letter in the avatar — prefer name, then email, then userId as last resort
    (function initAvatar() {
        const name = localStorage.getItem('name');
        const email = localStorage.getItem('email');
        const uid = localStorage.getItem('userId');
        const source = name || email || uid || '?';
        const letter = source.toString().trim().charAt(0).toUpperCase();
        const el = document.getElementById('userAvatar');
        if (el) el.textContent = letter;

        const welcomeEl = document.getElementById('welcomeName');
        if (welcomeEl) {
            welcomeEl.textContent = name ? `Welcome, ${name}` : (email ? `Welcome, ${email}` : '');
        }
    })();
</script>
</body>
</html>
