<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBank — Dashboard</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

    <!-- Top bar -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <div style="width:34px;height:34px;border-radius:50%;background:#0077ff;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;" id="userAvatar">?</div>
            <div style="font-weight:700;font-size:16px;">My<span style="color:#0077ff;">Bank</span></div>
        </div>
        <button onclick="logout()" style="background:transparent;color:#666;border:1px solid #ddd;padding:8px 14px;width:auto;">Logout</button>
    </div>

    <!-- Total balance -->
    <div class="card">
        <div style="font-size:13px;color:#888;text-transform:uppercase;letter-spacing:1px;">Total Balance</div>
        <div style="font-size:28px;font-weight:700;margin-top:6px;">₹<span id="totalBalance">0</span></div>
    </div>

    <!-- Accounts -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Your Accounts</h3>
        <div id="accounts"><p style="color:#888;">Loading accounts…</p></div>
    </div>

    <!-- Transfer -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Transfer Money</h3>
        <label style="font-size:12px;color:#888;">From Account</label>
        <input type="text" id="from" placeholder="Auto-filled from selection" readonly/>
        <label style="font-size:12px;color:#888;">To Account</label>
        <input type="text" id="to" placeholder="Recipient account number"/>
        <label style="font-size:12px;color:#888;">Amount (₹)</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01"/>
        <button onclick="transfer()">Send Money →</button>
    </div>

    <!-- Summary -->
    <div class="card" style="display:flex; gap:16px; flex-wrap:wrap;">
        <div style="flex:1;min-width:140px;">
            <div style="font-size:12px;color:#888;text-transform:uppercase;">Total Sent</div>
            <div style="font-size:20px;font-weight:700;color:#e53935;" id="totalSent">₹0</div>
            <div style="font-size:12px;color:#888;"><span id="sentCount">0</span> transactions</div>
        </div>
        <div style="flex:1;min-width:140px;">
            <div style="font-size:12px;color:#888;text-transform:uppercase;">Total Received</div>
            <div style="font-size:20px;font-weight:700;color:#0aa84f;" id="totalReceived">₹0</div>
            <div style="font-size:12px;color:#888;"><span id="receivedCount">0</span> transactions</div>
        </div>
        <div style="flex:1;min-width:140px;">
            <div style="font-size:12px;color:#888;text-transform:uppercase;">Total Transactions</div>
            <div style="font-size:20px;font-weight:700;" id="totalTransactions">0</div>
        </div>
    </div>

    <!-- Tabs -->
    <div class="card" style="display:flex; gap:8px;">
        <button id="tabAll" onclick="setTab('all')">All</button>
        <button id="tabSent" onclick="setTab('sent')" style="background:#eee;color:#333;">Sent</button>
        <button id="tabReceived" onclick="setTab('received')" style="background:#eee;color:#333;">Received</button>
    </div>

    <!-- Transaction history -->
    <div class="card">
        <h3 style="margin-bottom:10px;">Transaction History</h3>
        <table class="txn-table">
            <thead>
            <tr>
                <th>Transaction</th>
                <th>Accounts</th>
                <th>Amount</th>
            </tr>
            </thead>
            <tbody id="txnBody">
            <tr><td colspan="3" style="text-align:center;color:#888;">Loading transactions…</td></tr>
            </tbody>
        </table>
    </div>

</div>

<script src="dashboard.js"></script>
<script>
    function setTab(which) {
        document.getElementById('tabAll').style.background = which === 'all' ? '#0077ff' : '#eee';
        document.getElementById('tabAll').style.color = which === 'all' ? '#fff' : '#333';
        document.getElementById('tabSent').style.background = which === 'sent' ? '#0077ff' : '#eee';
        document.getElementById('tabSent').style.color = which === 'sent' ? '#fff' : '#333';
        document.getElementById('tabReceived').style.background = which === 'received' ? '#0077ff' : '#eee';
        document.getElementById('tabReceived').style.color = which === 'received' ? '#fff' : '#333';

        if (which === 'all') showAll();
        if (which === 'sent') showSent();
        if (which === 'received') showReceived();
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('userId');
        window.location.href = '/index.html';
    }

    // Show first letter of email/userId in the avatar, if available
    (function initAvatar() {
        const email = localStorage.getItem('email');
        const uid = localStorage.getItem('userId');
        const letter = (email || uid || '?').toString().charAt(0).toUpperCase();
        const el = document.getElementById('userAvatar');
        if (el) el.textContent = letter;
    })();
</script>
</body>
</html>
