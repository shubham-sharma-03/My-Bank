spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  application:
    name: banking-application

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}